server:
  forward-headers-strategy: framework

spring:
  mvc:
    format:
      date: iso
      date-time: iso
      time: iso
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:/db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 1h
  refresh-token-expiration: 14d

cookie:
  secure: true
  http-only: true
  path: /
  max-age: 1h
  same-site: lax

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}
  allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
  allowed-headers: Authorization,Content-Type,RefreshToken,X-Requested-With
  allow-credentials: true
  max-age: 1h

oauth:
  google:
    client-id: ${OAUTH_GOOGLE_CLIENT_ID}
    client-secret: ${OAUTH_GOOGLE_CLIENT_SECRET}
    redirect-uri: ${OAUTH_REDIRECT_URI_BASE}/oauth/callback/google
    scope: openid email profile
    urls:
      authorization: https://accounts.google.com/o/oauth2/v2/auth
      token: https://oauth2.googleapis.com/token
      user-info: https://www.googleapis.com/oauth2/v3/userinfo
  kakao:
    client-id: ${OAUTH_KAKAO_CLIENT_ID}
    client-secret: ${OAUTH_KAKAO_CLIENT_SECRET}
    redirect-uri: ${OAUTH_REDIRECT_URI_BASE}/oauth/callback/kakao
    scope: profile_nickname
    urls:
      authorization: https://kauth.kakao.com/oauth/authorize
      token: https://kauth.kakao.com/oauth/token
      user-info: https://kapi.kakao.com/v2/user/me

sms:
  solapi:
    api-key: ${SMS_SOLAPI_API_KEY}
    api-secret: ${SMS_SOLAPI_API_SECRET}
    sender-number: ${SMS_SOLAPI_SENDER_NUMBER}
  verification:
    code-length: 6
    ttl-minutes: 3
    resend-limit-seconds: 60
    max-attempts: 5

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  file:
    name: ${LOG_PATH:/home/ec2-user}/logs/application.log

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  packages-to-scan: com.maru.controller
  use-javadoc: true

toss:
  payments:
    secret-key: ${TOSS_SECRET_KEY}
    client-key: ${TOSS_CLIENT_KEY}
    base-url: https://api.tosspayments.com/v1
    encryption-key: ${TOSS_ENCRYPTION_KEY}

maru:
  demo:
    user-id: ${DEMO_USER_ID}
