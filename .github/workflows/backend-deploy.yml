name: Backend Deploy

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
  workflow_dispatch:

concurrency:
  group: maru-backend-prod
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: MARU_PROD_ENV
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build with Gradle
        run: ./gradlew clean build

      - name: Create env file
        working-directory: .
        run: |
          {
            printf 'SPRING_DATASOURCE_URL=%s\n' "${{ secrets.SPRING_DATASOURCE_URL }}"
            printf 'SPRING_DATASOURCE_USERNAME=%s\n' "${{ secrets.SPRING_DATASOURCE_USERNAME }}"
            printf 'SPRING_DATASOURCE_PASSWORD=%s\n' "${{ secrets.SPRING_DATASOURCE_PASSWORD }}"
            printf 'JWT_SECRET=%s\n' "${{ secrets.JWT_SECRET }}"
            printf 'CORS_ALLOWED_ORIGINS=%s\n' "${{ secrets.CORS_ALLOWED_ORIGINS }}"
            printf 'OAUTH_GOOGLE_CLIENT_ID=%s\n' "${{ secrets.OAUTH_GOOGLE_CLIENT_ID }}"
            printf 'OAUTH_GOOGLE_CLIENT_SECRET=%s\n' "${{ secrets.OAUTH_GOOGLE_CLIENT_SECRET }}"
            printf 'OAUTH_KAKAO_CLIENT_ID=%s\n' "${{ secrets.OAUTH_KAKAO_CLIENT_ID }}"
            printf 'OAUTH_KAKAO_CLIENT_SECRET=%s\n' "${{ secrets.OAUTH_KAKAO_CLIENT_SECRET }}"
            printf 'OAUTH_REDIRECT_URI_BASE=%s\n' "${{ secrets.OAUTH_REDIRECT_URI_BASE }}"
            printf 'SMS_SOLAPI_API_KEY=%s\n' "${{ secrets.SMS_SOLAPI_API_KEY }}"
            printf 'SMS_SOLAPI_API_SECRET=%s\n' "${{ secrets.SMS_SOLAPI_API_SECRET }}"
            printf 'SMS_SOLAPI_SENDER_NUMBER=%s\n' "${{ secrets.SMS_SOLAPI_SENDER_NUMBER }}"
            printf 'DEMO_USER_ID=%s\n' "${{ secrets.DEMO_USER_ID }}"
          } > maru-backend.env

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload Artifacts to S3
        run: |
          aws s3 cp build/libs/maru-backend.jar s3://${{ secrets.S3_BACKEND_BUCKET_NAME }}/backend/maru-backend.jar
          aws s3 cp ../maru-backend.env s3://${{ secrets.S3_BACKEND_BUCKET_NAME }}/backend/maru-backend.env

      - name: Deploy via SSM and Monitor Logs
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --instance-ids ${{ secrets.EC2_INSTANCE_ID }} \
            --parameters 'commands=["/home/ec2-user/deploy.sh"]' \
            --timeout-seconds 300 \
            --query "Command.CommandId" --output text)
          
          echo "Deployment started with Command ID: $COMMAND_ID"
          
          # 직접 폴링 (최대 5분)
          for i in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id ${{ secrets.EC2_INSTANCE_ID }} \
              --query "Status" --output text 2>/dev/null || echo "InProgress")
          
            echo "[$i/30] Status: $STATUS"
          
            if [ "$STATUS" = "Success" ]; then
              echo "Deployment successful!"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id ${{ secrets.EC2_INSTANCE_ID }} \
                --query "StandardOutputContent" --output text
              exit 0
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "TimedOut" ] || [ "$STATUS" = "Cancelled" ]; then
              echo "Deployment failed with status: $STATUS"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id ${{ secrets.EC2_INSTANCE_ID }} \
                --query "StandardErrorContent" --output text
              exit 1
            fi
          
            sleep 10
          done
          
          echo "Deployment timed out"
          exit 1